d-i base-installer/kernel/override-image string linux-image-amd64
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string Europe/Warsaw
d-i clock-setup/ntp boolean true
d-i auto-install/enable boolean true
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/add-kernel-opts string net.ifnames=0 biosdevname=0
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
d-i cdrom-detect/eject boolean false

# GRUB configuration
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

# APT and CD-ROM scan avoidance
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/use_mirror boolean true

# Partitioning
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/mount_style select uuid
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-basicfilesystems/choose_label string gpt
d-i partman-basicfilesystems/default_label string gpt
d-i partman-partitioning/choose_label string gpt
d-i partman-partitioning/default_label string gpt
d-i partman/choose_label string gpt
d-i partman/default_label string gpt
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select scheme
d-i partman-auto/expert_recipe string \
    scheme :: \
    1 1 1 free \
        $gptonly{ } \
        $primary{ } \
        $bios_boot{ } \
        method{ biosgrub } \
    . \
    2048 0 2048 ext4 \
        $gptonly{ } \
        $primary{ } \
        $bootable{ } \
        method{ format } \
        format{ } \
        use_filesystem{ } \
        filesystem{ ext4 } \
        mountpoint{ /boot } \
    . \
    1 0 -1 ext4 \
        $gptonly{ } \
        $primary{ } \
        method{ format } \
        format{ } \
        use_filesystem{ } \
        filesystem{ ext4 } \
        mountpoint{ / } \
    .

# Users and Passwords
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted string *
d-i passwd/make-user boolean false
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# Network
d-i netcfg/get_hostname string debian
d-i netcfg/get_domain string localdomain

# Package Selection
d-i debconf/frontend select noninteractive
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/install-language-support boolean false
d-i pkgsel/language-packs multiselect en
d-i pkgsel/update-policy select none
d-i pkgsel/upgrade select none
d-i pkgsel/updatedb boolean false
d-i pkgsel/include string \
    ca-certificates \
    cloud-guest-utils \
    python3 \
    hostname \
    locales \
    sudo \
    dialog \
    qemu-guest-agent \
    systemd-resolved \
    iptables \
    nfs-common

# Mirrors
d-i mirror/protocol string http
d-i mirror/http/proxy string
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/suite string trixie

# Late Command
d-i preseed/late_command string in-target /bin/bash -c ' \
    apt-get purge -y ifupdown dhcpcd-base isc-dhcp-client; \
    mkdir -p /etc/systemd/network; \
    printf "[Match]\nType=ether\n\n[Network]\nDHCP=yes\n" > /etc/systemd/network/99-ethernet.network; \
    rm -rf /etc/network; \
    rm -rf /etc/resolv.conf; \
    ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf; \
    sed -i '/cdrom/d' /etc/fstab; \
    systemctl unmask systemd-networkd.service; \
    systemctl enable systemd-networkd.service systemd-resolved.service; \
    systemctl enable ssh.service; \
    systemctl enable qemu-guest-agent.service serial-getty@ttyS0.service; \
    systemctl disable apt-daily.service apt-daily.timer apt-daily-upgrade.service apt-daily-upgrade.timer; \
    exit 0 \
'