# The full DVD ISO provides Anaconda, the installation tree, and packages.
cdrom

poweroff

ignoredisk --only-use=vda

lang en_US.UTF-8
keyboard us
timezone Europe/Warsaw --utc

firstboot --disabled
selinux --permissive
firewall --enabled --service=ssh

network --device=link --bootproto=dhcp --activate --onboot=on

bootloader --timeout=1
rootpw --plaintext password

zerombr
clearpart --all --initlabel --disklabel=gpt
part /boot/efi --fstype=efi --size=600 --fsoptions="umask=0077,shortname=winnt"
part /boot --fstype=ext4 --size=1024
part pv.01 --size=1 --grow
volgroup ol pv.01
logvol / --vgname=ol --name=root --fstype=xfs --size=1 --grow

# clearpart --all --initlabel --disklabel=gpt
# part /boot/efi --fstype=efi --size=600 --fsoptions="umask=0077,shortname=winnt"
# part / --fstype=xfs --size=1 --grow

%post --erroronfail
# workaround anaconda requirements and clear root password
passwd -d root
passwd -l root
rootpw --lock

# Clean up install config not applicable to deployed environments.
rm -f /etc/resolv.conf
touch /etc/resolv.conf
chown root:root /etc/resolv.conf
chmod 644 /etc/resolv.conf

rm -f /etc/sysconfig/network-scripts/ifcfg-[^lo]*

# Kickstart copies install boot options. Serial is turned on for logging with
# Packer which disables console output. Disable it so console output is shown
# during deployments
# sed -i 's/^GRUB_TERMINAL=.*/GRUB_TERMINAL_OUTPUT="console"/g' /etc/default/grub
# sed -i '/GRUB_SERIAL_COMMAND="serial"/d' /etc/default/grub
# sed -ri 's/(GRUB_CMDLINE_LINUX=".*)\s+console=ttyS0(.*")/\1\2/' /etc/default/grub
# sed -i 's/GRUB_ENABLE_BLSCFG=.*/GRUB_ENABLE_BLSCFG=false/g' /etc/default/grub

dnf clean all
%end

%packages --ignoremissing
@core
-i*-firmware
-plymouth
cloud-utils-growpart
python3
python3-oauthlib
rsync
tar
sudo
qemu-guest-agent
grub2-efi-x64
efibootmgr
shim-x64
dosfstools
lvm2
device-mapper-multipath
%end

%post --interpreter=/bin/bash
ssh-keygen -A
systemctl enable qemu-guest-agent.service sshd.service
# sed -i 's/^BLACKLIST_RPC=.*/BLACKLIST_RPC=/' /etc/sysconfig/qemu-ga
sed -i 's/^FILTER_RPC_ARGS=.*/FILTER_RPC_ARGS=\"\"/' /etc/sysconfig/qemu-ga
exit 0
%end